# OpsAgent 后端配置文件
server:
  # 服务监听端口，访问地址为 http://localhost:8080（开发阶段后端跑在 Windows 上）
  port: 8080

spring:
  application:
    # 应用名，后续接入监控与注册中心时会用到
    name: opsagent-backend

  # 数据源配置：告诉 Spring Boot 数据库在哪、用什么账号连接
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库运行在 Ubuntu 虚拟机的 Docker 容器里，所以地址是虚拟机的 IP
    # serverTimezone 必须显式指定，否则 MySQL 8 可能报时区错误
    # allowPublicKeyRetrieval=true 允许在没有 SSL 的情况下取回公钥（MySQL 8 默认加密方式需要）
    # characterEncoding=UTF-8 + connectionCollation=utf8mb4_unicode_ci：显式声明这条连接使用 utf8mb4，
    # 避免中文在传输过程中被按其他字符集解码成乱码
    url: jdbc:mysql://192.168.169.129:3306/opsagent?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 注意：这是"虚拟机里 Docker 容器中那台 MySQL"的密码。
    # 你电脑上还有一个本地 MySQL 服务（Windows 服务 MySQL80，Navicat 里的 mysql8 连接就是它），
    # 那是以前项目用的，和本项目无关，别把两个密码搞混。
    password: opsagent123

  # ============ AI 模型配置（DeepSeek）============
  # ⚠️ 前缀必须是 spring.ai，这是 Spring AI 约定的固定前缀。
  #    之前误写到 opsagent.ai 下面，Spring AI 完全读不到，启动时就报
  #    "OpenAI API key must be set"——这个坑记住：配置写对位置和信息填对同样重要。
  #
  # 说明：DeepSeek 提供 OpenAI 兼容接口，所以直接用 Spring AI 的 OpenAI 适配器，
  # 只要把 base-url 指向 DeepSeek 即可，不需要专门的 SDK。
  ai:
    openai:
      base-url: https://api.deepseek.com
      # API Key 从环境变量读取，绝不写死在配置里（仓库是公开的！）
      # 冒号后面是"环境变量不存在时的默认值"
      api-key: ${DEEPSEEK_API_KEY:not-configured}
      chat:
        options:
          # deepseek-chat：通用对话模型；deepseek-reasoner：推理模型（更慢更贵）
          model: deepseek-chat
          # 0~2，越高回答越随机。运维诊断场景建议偏低，减少胡编
          temperature: 0.3

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 开启下划线转驼峰：数据库的 server_name 会自动映射到 Java 的 serverName
    map-underscore-to-camel-case: true
    # 把执行的 SQL 打印到控制台，学习阶段非常有用，生产环境应关掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键使用数据库自增策略
      id-type: auto

# JWT 令牌配置
opsagent:
  jwt:
    # 签名密钥：用于给令牌"盖章"，别人拿不到这个密钥就无法伪造令牌。
    # HS256 算法要求密钥至少 32 字节。开发阶段直接写在配置里，
    # 生产环境必须换成随机长字符串，并通过环境变量注入，绝不能提交到仓库。
    secret: opsagent-dev-secret-key-please-change-in-production-2026
    # 单个令牌的有效期（分钟）。因为后端支持滑动续期，这里可以设短一些，安全性更高。
    expire-minutes: 30
    # 续签阈值（分钟）：令牌剩余有效期少于这个值时，后端会在响应头里下发新令牌
    renew-threshold-minutes: 20
    # 会话最大时长（小时）：从登录那一刻算起，超过这个时间必须重新登录（令牌不能无限续下去）
    max-session-hours: 12

  # 监控采集配置
  monitor:
    # 采集间隔（毫秒）。30000 = 每 30 秒采集一次。
    # 间隔越短曲线越细，但 SSH 连接和对目标服务器的压力也越大，按需调整。
    interval-ms: 30000

  # AI 用量与余额相关配置
  ai:
    # 余额告警阈值（元）：低于这个值，前端会弹提醒
    balance-warn-threshold: 5
    # 余额查询结果的缓存时长（秒）。余额变化慢，没必要每次刷新页面都去查一次接口
    balance-cache-seconds: 300
